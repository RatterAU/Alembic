<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1452"/>
      <stop offset="0.55" stop-color="#160B2E"/>
      <stop offset="1" stop-color="#0B0618"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.66" r="0.5">
      <stop offset="0" stop-color="#BF5AF2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64D2FF"/>
      <stop offset="0.5" stop-color="#9F6BFF"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EE3FF"/>
      <stop offset="1" stop-color="#40C8E0"/>
    </linearGradient>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="200" y1="180" x2="820" y2="880">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6DDFF"/>
    </linearGradient>
    <clipPath id="flask">
      <circle cx="430" cy="640" r="222"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(36 0)">

  <!-- liquid inside the round flask -->
  <g clip-path="url(#flask)">
    <path d="M190 640 C 270 610, 350 670, 430 640 S 590 610, 680 640 L 680 900 L 190 900 Z" fill="url(#liquid)"/>
    <circle cx="350" cy="745" r="16" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="470" cy="790" r="10" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="520" cy="712" r="7" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- glass: flask, neck, helm and spout drawn as one outline -->
  <g fill="none" stroke="url(#glass)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385 430 A 222 222 0 1 0 475 430"/>
    <path d="M385 430 L 385 330"/>
    <path d="M475 430 L 475 330"/>
    <!-- helm (the cap of the still) -->
    <path d="M360 330 L 500 330 C 520 250, 480 190, 430 190 C 380 190, 340 250, 360 330 Z"/>
    <!-- spout running down to the right -->
    <path d="M488 236 L 792 470"/>
  </g>
  <!-- glass highlight -->
  <path d="M300 560 A 160 160 0 0 1 360 470" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.45"/>

  <!-- the drop -->
  <path d="M800 548 C 800 548, 760 604, 760 632 C 760 656, 778 672, 800 672 C 822 672, 840 656, 840 632 C 840 604, 800 548, 800 548 Z" fill="url(#drop)"/>
  <ellipse cx="788" cy="630" rx="8" ry="14" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
