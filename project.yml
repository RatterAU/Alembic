name: Alembic
options:
  bundleIdPrefix: app.alembic
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  ENABLE_STRING_CATALOG_SYMBOL_GENERATION: YES

targets:
  Alembic:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.alembic.ios
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_OBJC_BRIDGING_HEADER: App/Engine/Alembic-Bridging-Header.h
      HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/App/Engine"]
      CLANG_ENABLE_OBJC_ARC: YES
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
      OTHER_LDFLAGS: ["$(inherited)"]
      ENABLE_BITCODE: NO
      DEAD_CODE_STRIPPING: YES
    sources:
      - path: App
    dependencies:
      - framework: vendor/python/Python.xcframework
        embed: true
      - framework: Frameworks/FFmpegCore.xcframework
        embed: true
        link: false
      - framework: Frameworks/FFmpegTool.xcframework
        embed: true
        link: false
      - framework: Frameworks/FFprobeTool.xcframework
        embed: true
        link: false
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: QuickLookThumbnailing.framework
      - sdk: Photos.framework
      - sdk: AVKit.framework
    postCompileScripts:
      - name: Install Python, engine and yt-dlp
        script: "\"$PROJECT_DIR/scripts/install-python.sh\""
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Alembic
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: "Alembic saves videos you choose to your photo library."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.alembic.ios
            CFBundleURLSchemes: [alembic]
        UIBackgroundModes: [audio]
